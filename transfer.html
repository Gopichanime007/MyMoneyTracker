<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transfers</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app">

  <div class="header">
    <h2>🤝 Transfers</h2>
  </div>

  <!-- ADD -->
  <div class="card">
    <h3>Add Transaction</h3>

    <input type="text" id="tPerson" placeholder="Person Name" />

    <select id="tDirection">
      <option value="given">You Gave</option>
      <option value="received">You Received</option>
    </select>

    <input type="number" id="tAmount" placeholder="Amount" />

    <select id="tPayment">
      <option value="UPI">UPI</option>
      <option value="Cash">Cash</option>
    </select>

    <input type="text" id="tNote" placeholder="Note" />

    <button class="primary" onclick="saveTransfer()">Save</button>
  </div>

  <!-- SUMMARY -->
  <div class="card">
    <h3>People Summary</h3>
    <div id="peopleSummary"></div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <h3>History</h3>
    <div id="transferHistory"></div>
  </div>

  <button class="action-btn" onclick="goBack()">⬅ Back</button>

</div>

<script src="script.js"></script>

<script>
  loadTransferUI();

  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
