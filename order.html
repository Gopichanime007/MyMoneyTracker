<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="order.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <h2>🛒 Order</h2>
    </header>

    <div class="card">

      <!-- ITEMS -->
      <h4>📋 Items</h4>

      <div class="table-wrapper">
        <div class="table-scroll">

          <div class="table-header">
            <span>Name</span>
            <span>Price</span>
            <span>Qty</span>
            <span>Source</span>
            <span>Link</span>
            <span>Total</span>
          </div>

          <div id="orderItems"></div>

        </div>
      </div>

      <!-- TOTAL -->
      <div class="summary">
        <p>Subtotal: ₹<span id="oSubtotal">0</span></p>
        <p>GST: ₹<span id="oGSTAmount">0</span></p>
        <h3>Total: ₹<span id="oFinalTotal">0</span></h3>
      </div>

      <!-- PAYMENT -->
      <h4>💳 Payment</h4>

      <!-- SOURCE TYPE -->
      <select id="oSourceType" onchange="loadSourceOptions()">
        <option value="">Select Source Type</option>
        <option value="savings">Savings</option>
        <option value="budget">Budget</option>
      </select>

      <!-- SOURCE LIST -->
      <select id="oSource">
        <option value="">Select Source</option>
      </select>
      <div id="sourcePreview"></div>
      <select id="oPaymentType">
        <option value="">Payment Type</option>
        <option>UPI</option>
        <option>Cash</option>
        <option>Card</option>
      </select>

      <!-- ACTION -->
      <button class="primary" onclick="completePurchase()">✅ Purchase Complete</button>
      <button class="secondary" onclick="cancelOrder()">❌ Cancel</button>

    </div>

  </div>
  <script src="script.js"></script>
  <script src="order.js"></script>
</body>

</html>
