<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Money Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h2>💰 Money Tracker</h2>
    </header>

    <!-- NAVIGATION -->
    <nav class="nav">
      <button type="button" onclick="showScreen('home')">🏠</button>
      <button type="button" onclick="showScreen('add')">➕</button>
      <button type="button" onclick="showScreen('history')">📜</button>
      <button type="button" onclick="showScreen('budget')">💼</button>
      <button type="button" onclick="showScreen('graph')">📊</button>
      <button type="button" onclick="showScreen('settings')">⚙️</button>
    </nav>

    <!-- ================= HOME ================= -->
    <section id="home" class="screen active">
      <div class="card">
        <h3>Dashboard</h3>

        <div class="dashboard-grid">

          <div class="dash-card budget">
            <span>Budget</span>
            <h2>₹<span id="budgetValue">0</span></h2>
          </div>

          <div class="dash-card spent">
            <span>Spent</span>
            <h2>₹<span id="spent">0</span></h2>
          </div>

          <div id="remainingCard" class="dash-card remaining clickable-card">
            <span>Remaining</span>
            <h2>₹<span id="remaining">0</span></h2>
          </div>

          <div class="dash-card today">
            <span>Today</span>
            <h2>₹<span id="todaySpent">0</span></h2>
          </div>

        </div>

        <!-- Progress -->
        <div class="progress-wrapper">
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <p id="progressText"></p>
        </div>

      </div>
    </section>

    <!-- ================= ADD ================= -->
    <section id="add" class="screen">
      <div class="card">
        <h3>Add Entry</h3>

        <select id="entryType">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <input type="number" id="amount" placeholder="Amount">
        <select id="category"></select>
        <input type="text" id="purpose" placeholder="Purpose (optional)">
        <input type="date" id="expenseDate">

        <select id="paymentType">
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="PhonePe">PhonePe</option>
          <option value="Google Pay">Google Pay</option>
          <option value="Bank Transfer">Bank Transfer</option>
        </select>

        <button type="button" class="primary" onclick="saveExpense()">Save</button>
      </div>
    </section>

    <!-- ================= HISTORY ================= -->
    <section id="history" class="screen">
      <div class="card">
        <h3>History</h3>

        <select onchange="handleFilter(this.value)">
          <option value="all">All</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="period">Custom Period</option>
        </select>

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="button" class="icon-btn" onclick="exportPDF()">⬇</button>
          <button type="button" class="icon-btn" onclick="sharePDF()">📤</button>
        </div>

        <div id="historyList"></div>
      </div>
    </section>

    <!-- ================= BUDGET ================= -->
    <section id="budget" class="screen">
      <div class="card">
        <h3>Budget</h3>

        <p>Current: ₹<span id="currentBudget">0</span></p>

        <select id="budgetType">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly" selected>Monthly</option>
        </select>

        <input type="month" id="budgetMonth">
        <input type="number" id="budgetAmount" placeholder="Amount">

        <p>Daily Limit: ₹<span id="calculatedDaily">0</span></p>

        <button type="button" class="primary" onclick="saveBudget()">Save</button>
      </div>
    </section>

    <!-- ================= GRAPH ================= -->
    <section id="graph" class="screen">
      <div class="card">
        <h3>Analytics</h3>

        <div style="display:flex; gap:8px;">
          <select onchange="handleGraphFilter(this.value)">
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
          </select>

          <button type="button" class="icon-btn" onclick="openCustomModal()">📅</button>
        </div>

        <div class="chart-container">
          <canvas id="myChart"></canvas>
        </div>

        <div class="card" style="margin-top:10px;">
          <h4>Category Breakdown</h4>
          <div id="categoryListGraph"></div>
        </div>

        <div id="graphDate" style="text-align:center; font-size:12px; color:#777;"></div>
      </div>
    </section>

    <!-- ================= SETTINGS ================= -->
    <section id="settings" class="screen">
      <div class="card">

        <h3>Settings</h3>

        <!-- Theme -->
        <h4>Theme</h4>
        <select onchange="handleTheme(this.value)">
          <option value="#4caf50">Green</option>
          <option value="#ff5722">Orange</option>
          <option value="#2196f3">Blue</option>
          <option value="custom">Custom</option>
        </select>

        <input type="color" id="colorPicker" style="display:none;" onchange="applyCustomColor(this.value)">

        <!-- Category -->
        <h4>Add Category</h4>
        <input type="text" id="newCategory" placeholder="New category">
        <button type="button" onclick="addCategory()">Add</button>

        <h4 onclick="openCategoryModal()" style="cursor:pointer;">Your Categories ⬇️</h4>

        <!-- Modal -->
        <div id="categoryModal" class="modal">
          <div class="modal-content">
            <h3>Your Categories</h3>
            <div id="categoryList"></div>
            <button type="button" onclick="closeCategoryModal()">Close</button>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- DATE MODAL -->
  <div id="dateModal" class="modal">
    <div class="modal-content">
      <h3>Select Period</h3>

      <input type="date" id="fromDate">
      <input type="date" id="toDate">

      <button type="button" onclick="applyDateFilter()">Apply</button>
      <button type="button" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>

</html>
