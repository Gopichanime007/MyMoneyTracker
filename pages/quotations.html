<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Purchase Plans</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/quotations.css">
</head>

<body>
  <div class="app">
    <header class="header header-row">
      <button class="back-btn" type="button" onclick="window.location.href='../index.html'">←</button>
      <div>
        <h2>Open Quotations</h2>
        <p class="header-subtitle">Personal finance purchase plan workspace</p>
      </div>
    </header>

    <div class="card">
      <div class="workspace-toolbar">
        <h3>Purchase Plan Workspace</h3>
        <div class="action-bar action-bar-3">
          <button id="quotationsFilterActionBtn" class="secondary" type="button"
            onclick="openQuotationsFilterModal()">Filter</button>
          <button class="secondary" type="button" onclick="openQuotationsSortModal()">Sort</button>
          <button class="primary" type="button" onclick="createNewPlan()">+ New Plan</button>
        </div>
      </div>

      <div id="quotationsQueryChips" class="query-chip-row"></div>

      <div class="inline-row">
        <select id="quotationsSavedView"></select>
        <button class="secondary" type="button" onclick="saveQuotationsCurrentView()">Save View</button>
        <button class="secondary" type="button" onclick="applyQuotationsSavedView()">Apply View</button>
        <button class="danger" type="button" onclick="deleteQuotationsSavedView()">Delete View</button>
      </div>

      <div class="workspace-section">
        <h4>Draft Plans</h4>
        <div id="draftPlansList"></div>
      </div>

      <div class="workspace-section">
        <h4>Accepted Plans</h4>
        <div id="acceptedPlansList"></div>
      </div>

      <div class="workspace-section">
        <h4>Expired Plans</h4>
        <div id="expiredPlansList"></div>
      </div>

      <div class="workspace-section">
        <h4>Converted Plans</h4>
        <div id="convertedPlansList"></div>
      </div>
    </div>
  </div>

  <div id="quotationsFilterModal" class="modal hidden" onclick="closeQuotationsFilterModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Quotation Filter Builder</h3>
      <div id="quotationsFilterBuilderRoot"></div>
    </div>
  </div>

  <div id="quotationsSortModal" class="modal hidden" onclick="closeQuotationsSortModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Quotation Sort</h3>

      <label for="quotationsSortField">Field</label>
      <select id="quotationsSortField">
        <option value="updatedAt">Last Updated</option>
        <option value="total">Amount</option>
        <option value="status">Status</option>
        <option value="quotationNo">Quotation No</option>
      </select>

      <label for="quotationsSortDirection">Direction</label>
      <select id="quotationsSortDirection">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>

      <div class="modal-actions sort-modal-actions">
        <button class="secondary" type="button" onclick="closeQuotationsSortModal()">Close</button>
        <button class="secondary" type="button" onclick="clearQuotationsSortModal()">Clear</button>
        <button class="primary" type="button" onclick="applyQuotationsSortModal()">Apply</button>
      </div>
    </div>
  </div>

  <div id="planNavigationModal" class="modal hidden" onclick="closePlanNavigationModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Open Purchase Plan</h3>
      <p id="planNavigationInfo" class="modal-sub"></p>
      <div class="modal-actions modal-stack-actions">
        <button class="primary" type="button" id="openPlanBtn">Open Purchase Plan</button>
        <button class="secondary" type="button" id="openLinkedOrderBtn">Open Linked Order</button>
      </div>
      <button class="secondary" type="button" onclick="closePlanNavigationModal()">Close</button>
    </div>
  </div>

  <script src="../assets/scripts/documentWorkflow.js"></script>
  <script src="../assets/scripts/queryEngine.js"></script>
  <script src="../assets/scripts/searchService.js"></script>
  <script src="../assets/scripts/filterBuilder.js"></script>
  <script src="../assets/scripts/script.js"></script>
  <script src="../assets/scripts/quotations.js"></script>
  <script src="assets/scripts/applyTheme.js"></script>
</body>

</html>
