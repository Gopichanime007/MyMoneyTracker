<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Quotation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/quotation.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="header-container">
        <h2>🧾 Quotation</h2>
        <button onclick="goBack()" class="secondary back-btn">←</button>
      </div>
    </header>

    <div class="card">

      <!-- ACTION BUTTONS -->
      <div class="row">
        <button class="primary" onclick="openItemModal()">➕ Add Item</button>
        <button class="secondary" onclick="openChargeModal()">➕ Add Charge</button>
      </div>

      <!-- ITEMS -->
      <h4>📋 Items</h4>

      <div class="table-wrapper">
        <div class="table-scroll">

          <div class="table-header">
            <span>Name</span>
            <span>Price</span>
            <span>Qty</span>
            <span>Source</span>
            <span>Link</span>
            <span>Total</span>
            <span>Action</span>
          </div>

          <div id="quotationItems"></div>

        </div>
      </div>

      <!-- CHARGES -->
      <h4>➕ Charges</h4>
      <div id="chargesList"></div>

      <!-- TOTAL -->
      <div class="summary">
        <p>Subtotal: <span id="qSubtotal">0</span></p>
        <p>GST: <span id="qGSTAmount">0</span></p>
        <h3>Total: <span id="qFinalTotal">0</span></h3>
      </div>

      <!-- ACTION -->
      <button class="primary" onclick="convertToOrder()">🔄 Convert to Order</button>
      <button class="secondary" onclick="clearQuotation()">🗑 Clear</button>

    </div>

  </div>

  <!-- ================= ITEM MODAL ================= -->
  <div id="itemModal" class="modal">
    <div class="modal-content">

      <h3>Add Item</h3>

      <!-- PRODUCT -->
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="mName" placeholder="Enter product name">
      </div>

      <!-- PRICE + QTY + UNIT -->
      <div class="form-row">

        <div class="form-field">
          <label>Price</label>
          <input type="number" id="mPrice" placeholder="Price">
        </div>

        <div class="form-field">
          <label>Qty</label>
          <input type="number" id="mQty" step="0.01" placeholder="Qty">
        </div>

        <div class="form-field">
          <label>Unit</label>
          <select id="mUnit">
            <option value="pcs">pcs</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="ltr">ltr</option>
            <option value="hrs">hrs</option>
            <option value="pack">pack</option>
          </select>
        </div>

      </div>

      <!-- SOURCE -->
      <div class="form-group">
        <label>Source</label>
        <select id="mSource" onchange="handleSourceChange(this.value)">
          <option value="">Select source</option>
        </select>

        <input type="text" id="newSourceInput" placeholder="Enter new source" style="display:none; margin-top:8px;">
      </div>

      <!-- LINK -->
      <div class="form-group">
        <label>Product Link</label>

        <div class="link-row">
          <input type="text" id="mLink" placeholder="Paste product link">
          <button class="secondary" onclick="openProductLink()">🔍</button>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="modal-actions">
        <button class="secondary" onclick="closeItemModal()">Cancel</button>
        <button class="primary" onclick="addItemFromModal()">Add Item</button>
      </div>

    </div>
  </div>

  <!-- ================= CHARGE MODAL ================= -->
  <div id="chargeModal" class="modal">
    <div class="modal-content">

      <h3>Add Charge</h3>

      <select id="cType">
        <option value="delivery">Delivery</option>
        <option value="gst">GST</option>
        <option value="discount">Discount</option>
        <option value="custom">Custom</option>
      </select>

      <input type="number" id="cValue" placeholder="Value">

      <select id="cMode">
        <option value="fixed" id="fixedCurrencyOption">Fixed</option>
        <option value="percent">Percentage %</option>
      </select>
      <label>Apply To</label>
      <select id="cApplyTo">
        <option value="all">All Items</option>
      </select>

      <div class="modal-actions">
        <button class="secondary" onclick="closeChargeModal()">Cancel</button>
        <button class="primary" onclick="addCharge()">Add</button>
      </div>

    </div>
  </div>

  <script src="../assets/scripts/storage.js"></script>
  <script src="../assets/scripts/script.js"></script>
  <script src="../assets/scripts/quotation.js"></script>
</body>

</html>
