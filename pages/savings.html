<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Savings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> -->
  <link rel="stylesheet" href="../assets/styles/savings.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h2>💰 Savings</h2>
    </header>

    <!-- NAV -->
    <nav class="nav">
      <button data-screen="home" onclick="showSavingsScreen('home')" class="active">🏠</button>
      <button data-screen="add" onclick="showSavingsScreen('add')">➕</button>
      <button data-screen="history" onclick="showSavingsScreen('history')">📜</button>
      <button data-screen="graph" onclick="showSavingsScreen('graph')">📊</button>
      <button data-screen="income" onclick="showSavingsScreen('income')">🏦</button>
      <button data-screen="settings" onclick="showSavingsScreen('settings')">⚙️</button>
      <button onclick="goToTransfers()">🔁</button>
    </nav>

    <!-- ================= HOME ================= -->
    <section id="home" class="screen active">
      <div class="card">
        <h3>Total Savings</h3>
        <h1 id="savingsBalance">0</h1>

        <div class="summary">
          <div class="box">
            <small>📦 Allocated</small>
            <h3 id="allocatedToBudget">0</h3>
          </div>
          <div class="box success">
            <small>💵 Available</small>
            <h3 id="availableBalance">0</h3>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= ADD ================= -->
    <section id="add" class="screen">
      <div class="card">
        <h3>Add Entry</h3>

        <!-- TYPE -->
        <select id="sType" onchange="handleSavingsTypeChange()">
          <option value="income">Add Savings</option>
          <option value="withdraw_budget">Move to Budget</option>
          <option value="transfer">Transfer</option>
        </select>

        <!-- BASIC INFO -->
        <input type="number" id="sAmount" placeholder="Amount">

        <select id="sEntity"></select>
        <div id="personWrapper">
          <label>Person</label>
          <select id="sPerson"></select>
        </div>

        <input type="text" id="sNote" placeholder="Purpose / Note">

        <!-- MAIN DATE -->
        <label>Date</label>
        <input type="date" id="sDate">

        <!-- SOURCE -->
        <div id="sourceWrapper" style="display:none;">
          <label>Source</label>
          <select id="sourceSelect"></select>
        </div>

        <!-- ================= BUDGET CONFIG ================= -->
        <div id="budgetConfig" style="display:none; margin-top:10px;">

          <label>Budget Period</label>
          <select id="budgetPeriod" onchange="handleBudgetPeriodChange()">
            <option value="day">Daily</option>
            <option value="week">Weekly</option>
            <option value="month" selected>Monthly</option>
          </select>

          <!-- ✅ SINGLE SOURCE OF TRUTH -->
          <label>Budget Month</label>
          <input type="date" id="budgetDate">

          <!-- optional helper -->
          <small style="color:#666;">
            Select month (day will be ignored)
          </small>

        </div>

        <!-- PAYMENT -->
        <label>Payment Method</label>
        <select id="sPayment">
          <option>Cash</option>
          <option>UPI</option>
          <option>PhonePe</option>
          <option>Google Pay</option>
          <option>Bank</option>
        </select>

        <!-- ACTION -->
        <button class="primary" onclick="addSavings()">Save</button>

      </div>
    </section>
    <!-- ================= HISTORY ================= -->
    <section id="history" class="screen">
      <div class="card">
        <h3>History</h3>

        <select onchange="handleSavingsFilter(this.value)">
          <option value="all">All</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="period">Custom Period</option>
        </select>

        <button class="primary" onclick="exportSavingsPDF()">
          📄 Download Report
        </button>

        <div id="savingsHistory"></div>
      </div>
    </section>

    <!-- ================= GRAPH ================= -->
    <section id="graph" class="screen">
      <div class="card">

        <div class="card-header">
          <h3>📊 Savings Graph</h3>
        </div>

        <select onchange="handleSavingsFilter(this.value)">
          <option value="all">All</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="period">Custom Period</option>
        </select>

        <div class="chart-box">
          <div class="chart-inner">
            <canvas id="savingsChart"></canvas>
          </div>
        </div>

      </div>
    </section>
    <section id="details" class="screen">
      <div class="card">
        <div class="card-header">
          <h3>📊 Source Details</h3>
          <button class="secondary" onclick="showSavingsScreen('income')">
            ⬅
          </button>
        </div>

        <div id="sourceDetails"></div>
      </div>
    </section>
    <section id="income" class="screen">
      <div class="card">
        <h3>💰 Income Sources</h3>
        <div id="incomeList"></div>
      </div>
    </section>
    <!-- ================= SETTINGS ================= -->
    <section id="settings" class="screen">
      <div class="card">
        <h3>⚙️ Settings</h3>

        <!-- ========================= -->
        <!-- CATEGORY SECTION -->
        <!-- ========================= -->
        <div class="input-row">
          <input type="text" id="newCategory" placeholder="Add Category">
          <button class="primary" onclick="addCategory()">➕</button>
        </div>

        <h4 onclick="openCategoryModal()" style="cursor:pointer;">
          Your Categories ⬇️
        </h4>

        <!-- CATEGORY MODAL -->
        <div id="categoryModal" class="modal" onclick="closeCategoryModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Your Categories</h3>
            <div id="categoryList"></div>
            <button class="primary" onclick="closeCategoryModal()">Close</button>
          </div>
        </div>

        <!-- ========================= -->
        <!-- PERSON SECTION -->
        <!-- ========================= -->
        <div class="input-row">
          <input type="text" id="newPerson" placeholder="Add Person">
          <button class="primary" onclick="addPerson()">➕</button>
        </div>

        <h4 onclick="openPersonModal()" style="cursor:pointer;">
          Your Persons ⬇️
        </h4>

        <!-- PERSON MODAL -->
        <div id="personModal" class="modal" onclick="closePersonModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Your Persons</h3>
            <div id="personList"></div>
            <button class="primary" onclick="closePersonModal()">Close</button>
          </div>
        </div>

        <!-- ========================= -->
        <!-- NAVIGATION -->
        <!-- ========================= -->
        <button class="primary" onclick="goToDashboard()">
          🏠 Go to Main Dashboard
        </button>

      </div>
    </section>

  </div>

  <!-- MODAL -->
  <div id="savingsDateModal" class="modal">
    <div class="modal-content">
      <h3>Select Period</h3>

      <input type="date" id="sFromDate">
      <input type="date" id="sToDate">

      <div class="modal-actions">
        <button class="secondary" onclick="closeSavingsModal()">Cancel</button>
        <button class="primary" onclick="applySavingsDateFilter()">Apply</button>
      </div>
    </div>
  </div>

  <div id="addPersonModal" class="modal" onclick="closeAddPersonModal()">
    <div class="modal-content" onclick="event.stopPropagation()">

      <h3>Add New Person</h3>

      <input type="text" id="newPersonInput" placeholder="Enter person name">

      <div class="modal-actions">
        <button class="secondary" onclick="closeAddPersonModal()">Cancel</button>
        <button class="primary" onclick="confirmAddPerson()">Add</button>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/scripts/storage.js"></script>
  <script src="../assets/scripts/script.js"></script>
  <script src="../assets/scripts/savings.js"></script>

  <script>
    function goBack() {
      window.location.href = "../index.html";
    }
  </script>

</body>

</html>
