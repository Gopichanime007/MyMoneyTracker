<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Budget Ledger</title>
  <link rel="stylesheet" href="../assets/styles/style.css" />
  <link rel="stylesheet" href="../assets/styles/daily-budget-ledger.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app">
    <header class="header">
      <button class="secondary back-btn" type="button" onclick="goBackToPreviousPage()" aria-label="Go back">
        Back</button>
      <h2>📘 Daily Budget Ledger</h2>
      <p class="muted">Track daily spending, savings, and deficits with running balance updates.</p>
    </header>

    <section class="card ledger-shell">
      <div class="section-title-row">
        <h3>Daily Budget</h3>
        <span id="ledgerEntryCount" class="ledger-pill">0 entries</span>
      </div>

      <div class="ledger-budget-control">
        <label for="dailyBudgetInput">Fixed Daily Budget</label>
        <input id="dailyBudgetInput" type="number" min="0" step="1" placeholder="100" />
        <button id="saveDailyBudget" class="primary" type="button">Save Budget</button>
      </div>

      <!-- NEW: week-start control. The JS reads this automatically
           (id must stay exactly "weekStartDaySelect") — no other
           wiring needed. Value is remembered in localStorage. -->
      <label for="weekStartDaySelect">Week Starts On</label>
      <select id="weekStartDaySelect">
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
      </select>

    </section>

    <section class="card ledger-shell">
      <div class="section-title-row">
        <h3>Ledger View</h3>
        <div class="ledger-tools">
          <button id="dailyLedgerFilterButton" class="secondary" type="button">Filter</button>
          <details class="secondary-accordion ledger-download-menu">
            <summary>Download</summary>
            <div class="ledger-download-options">
              <button id="downloadDailyLedgerPdf" class="secondary" type="button">PDF</button>
              <button id="downloadDailyLedgerExcel" class="secondary" type="button">Excel</button>
            </div>
          </details>
          <label class="sr-only" for="dailyLedgerSort">Sort ledger</label>
          <select id="dailyLedgerSort" aria-label="Sort ledger">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </div>
      </div>
      <div class="ledger-table-container">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>Date (Day)</th>
              <th>Budget</th>
              <th>Spent</th>
              <th>Savings</th>
              <th>Deficit</th>
              <th>Running Balance</th>
            </tr>
          </thead>
          <tbody id="ledgerEntries">
            <!-- JavaScript will insert rows here -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="dailyLedgerFilterModal" class="modal hidden" onclick="closeLedgerFilterModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Daily Ledger Filter</h3>
      <div id="dailyLedgerFilterBuilderRoot"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/scripts/queryEngine.js"></script>
  <script src="../assets/scripts/searchService.js"></script>
  <script src="../assets/scripts/filterBuilder.js"></script>
  <script src="../assets/scripts/dailyBudgetLedger.js"></script>
  <script>
    function goBackToPreviousPage() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.history.back();
        return;
      }
      window.location.href = '../index.html';
    }
  </script>
  <script src="../assets/scripts/applyTheme.js"></script>
</body>

</html>
